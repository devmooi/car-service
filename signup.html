<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정비노트 - 계정 신청</title>
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>

<body>
  <section class="login-screen">
    <form class="login-card" id="signup-form">
      <div class="login-brand">정비노트</div>
      <p class="login-title">자동차검사정비 · 계정 신청</p>

      <div class="field">
        <label for="su-id">아이디</label>
        <input class="input" id="su-id" type="text" placeholder="아이디를 입력하세요" autocomplete="username">
        <p class="field-msg" id="su-id-msg">영문으로 시작, 영문·숫자 4~12자</p>
      </div>
      <div class="field">
        <label for="su-pw">비밀번호</label>
        <div class="pw-wrap">
          <input class="input" id="su-pw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="su-pw">보기</button>
        </div>
        <p class="field-msg" id="su-pw-msg">영문·숫자·특수문자(!@#$%^&*) 포함 8~15자</p>
      </div>
      <div class="field">
        <label for="su-pw2">비밀번호 확인</label>
        <div class="pw-wrap">
          <input class="input" id="su-pw2" type="password" placeholder="비밀번호를 한 번 더 입력하세요" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="su-pw2">보기</button>
        </div>
        <p class="field-msg" id="su-pw2-msg">위 비밀번호와 똑같이</p>
      </div>
      <div class="field">
        <label for="su-name">이름</label>
        <input class="input" id="su-name" type="text" placeholder="예: 홍길동">
        <p class="field-msg" id="su-name-msg">한글 2자 이상</p>
      </div>
      <div class="field">
        <label for="su-phone">연락처</label>
        <input class="input" id="su-phone" type="tel" placeholder="010-1234-5678">
        <p class="field-msg" id="su-phone-msg">010-1234-5678 형식</p>
      </div>

      <button class="btn-login" id="signup-btn" type="submit" disabled>계정 신청</button>
      <p class="form-result" id="signup-result"></p>

      <p class="login-foot">
        <span>이미 계정이 있으신가요?</span>
        <a href="./login.html">로그인</a>
      </p>
    </form>
  </section>
  <script src="./js/password-toggle.js"></script>
  <script src="./js/signup.js"></script>
</body>

</html>
