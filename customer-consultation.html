<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정비노트 - 고객상담</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/customer-consultation.css" />
  </head>

  <body>
    <header>
      <div class="header-left">
        <button
          type="button"
          class="menu-toggle"
          id="menuToggle"
          aria-label="메뉴 열기"
          aria-expanded="false"
        >
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
        <a href="./index.html" class="logo">정비노트</a>
        <nav id="navMenu">
          <a href="./index.html">대시보드</a>
          <a href="./vehicle-management.html">차량관리</a>
          <a href="./maintenance-history.html">정비 이력</a>
          <a href="./customer-consultation.html" class="active">고객 상담</a>
        </nav>
      </div>
      <div class="header-right">
        <div class="no-profile">김</div>
        <span class="user-name">김정비 사장님</span>
      </div>
    </header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <main>
      <section class="title-section">
        <div>
          <h1>고객 상담 접수</h1>
          <p>전화 및 방문 접수 내용을 기록하고 견적을 작성합니다</p>
        </div>
      </section>

      <form class="form-card">
        <div class="form-sec">
          <h3>기본 정보</h3>
          <div class="grid-2">
            <div class="field">
              <label for="cc-date">입고일자</label>
              <input
                class="input"
                id="cc-date"
                type="date"
                value="2026-09-14"
              />
            </div>
            <div class="field">
              <label for="cc-plate">차량번호</label>
              <input
                class="input"
                id="cc-plate"
                type="text"
                placeholder="예: 12가 3456"
              />
            </div>
            <div class="field">
              <label for="cc-car">차량명</label>
              <input
                class="input"
                id="cc-car"
                type="text"
                placeholder="예: 그랜저 IG"
              />
            </div>
            <div class="field">
              <label for="cc-tel"
                >연락처
                <span class="hint">저장 시 010-****-**** 로 마스킹</span></label
              >
              <input
                class="input"
                id="cc-tel"
                type="text"
                placeholder="예: 010-1234-5678"
              />
            </div>
          </div>
        </div>

        <div class="form-sec">
          <h3>접수 상태</h3>
          <div class="segmented">
            <button type="button" class="active">입고</button>
            <button type="button">미입고</button>
            <button type="button">출고</button>
          </div>
        </div>

        <div class="form-sec">
          <h3>
            고객 요청사항 및 작업 내용
            <span class="spacer"></span>
            <button type="button" class="btn-add-row">+ 행 추가</button>
          </h3>
          <div class="items-head">
            <div>고객 요청</div>
            <div>작업 내용</div>
            <div>예상 비용</div>
            <div></div>
          </div>
          <div class="item-row">
            <div class="c-req">
              <input
                type="text"
                value="시동이 잘 안 걸림"
                placeholder="고객이 말한 증상"
              />
            </div>
            <div class="c-work">
              <input
                type="text"
                value="배터리 전압 점검 및 교체"
                placeholder="정비사 작업 내용"
              />
            </div>
            <div class="c-cost">
              <input type="text" value="130,000" placeholder="0" />
            </div>
            <button type="button" class="del" aria-label="삭제">×</button>
          </div>
          <div class="item-row">
            <div class="c-req">
              <input
                type="text"
                value="엔진오일 교환 시기 문의"
                placeholder="고객이 말한 증상"
              />
            </div>
            <div class="c-work">
              <input
                type="text"
                value="엔진오일·오일필터 교환"
                placeholder="정비사 작업 내용"
              />
            </div>
            <div class="c-cost">
              <input type="text" value="73,000" placeholder="0" />
            </div>
            <button type="button" class="del" aria-label="삭제">×</button>
          </div>
          <div class="sum-row">
            <span class="sum-label">합계 (자동 계산)</span>
            <span class="sum-value">203,000원</span>
          </div>
        </div>

        <div class="form-sec">
          <h3>안내 및 동의</h3>
          <div class="agree">
            · 차량 점검 과정에서 시운전이 발생할 수 있음을 안내드립니다.<br />
            · 표준정비시간과 실정비시간이 다를 경우 사전에 안내드립니다.<br />
            · 기재하신 개인정보는 차량 수리 목적으로만 이용되며, 그 외 목적 사용
            시 별도 동의를 받습니다.
          </div>
        </div>

        <div class="form-foot">
          <button type="button" class="btn-ghost" id="print">인쇄</button>
          <button type="submit" class="btn-accent">접수 저장</button>
        </div>
      </form>
    </main>
    <script src="./js/menu.js"></script>
    <script src="./js/customer-consultation.js"></script>
  </body>
</html>
