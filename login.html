<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정비노트 - 로그인</title>
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>

<body>
  <section class="login-screen">
    <form class="login-card">
      <div class="login-brand">정비노트</div>
      <p class="login-title">자동차검사정비 · 관리자</p>

      <div class="field">
        <label for="lg-id">아이디</label>
        <input class="input" id="lg-id" type="text" placeholder="아이디를 입력하세요" autocomplete="username">
      </div>
      <div class="field">
        <label for="lg-pw">비밀번호</label>
        <div class="pw-wrap">
          <input class="input" id="lg-pw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="lg-pw">보기</button>
        </div>
      </div>

      <button class="btn-login" type="submit">로그인</button>
      <p class="form-result error" id="login-result"></p>

      <p class="login-foot">
        <a href="./signup.html">계정 신청</a>
        <span class="sep">·</span>
        <a href="#">비밀번호를 잊으셨나요?</a>
      </p>
    </form>
  </section>
  <script src="./js/password-toggle.js"></script>
  <script src="./js/login.js"></script>
</body>

</html>
